name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch external links that break and pinned versions that
    # fall behind without any commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes html-validate@11 index.html

  css:
    name: Lint CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Installed locally (not via npx) so stylelint can resolve the shared config.
      - run: npm install --no-save --no-package-lock stylelint@18 stylelint-config-standard@41
      - run: npx stylelint style.css

  js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Installed locally (not via npx) so eslint.config.mjs can import @eslint/js.
      - run: npm install --no-save --no-package-lock eslint@10 @eslint/js@10
      - run: npx eslint script/

  shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - run: shellcheck --version && shellcheck .githooks/pre-commit .github/scripts/check-updates.sh

  json:
    name: Check JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Web app manifest parses
        run: jq empty site.webmanifest
      - name: JSON-LD in index.html parses
        shell: python3 {0}
        run: |
          import json, re, sys
          html = open("index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not blocks:
              sys.exit("No JSON-LD block found in index.html")
          for block in blocks:
              json.loads(block)
          print(f"{len(blocks)} JSON-LD block(s) OK")

  rendered-images:
    name: Check rendered PNGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fails when a source SVG was changed in a commit that a PNG rendered
      # from it has not caught up with. Each line: PNG, then its sources.
      - run: |
          status=0
          while read -r png sources; do
            png_commit=$(git log -1 --format=%H -- "$png")
            for source in $sources; do
              source_commit=$(git log -1 --format=%H -- "$source")
              if ! git merge-base --is-ancestor "$source_commit" "$png_commit"; then
                echo "::error file=$png::$source changed in $source_commit after $png was last rendered. Re-render it (see README)."
                status=1
              fi
            done
          done <<'EOF'
          img/og-image.png                    img/og-image.svg
          favicon.ico                         favicons/favicon.svg
          favicons/favicon-16x16.png          favicons/favicon.svg
          favicons/favicon-32x32.png          favicons/favicon.svg
          favicons/apple-touch-icon.png       favicons/favicon.svg
          favicons/android-chrome-192x192.png favicons/favicon.svg
          favicons/android-chrome-512x512.png favicons/favicon.svg
          favicons/maskable-192x192.png       favicons/maskable.svg favicons/favicon.svg
          favicons/maskable-512x512.png       favicons/maskable.svg favicons/favicon.svg
          EOF
          exit "$status"

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with HTTP 999, so it is skipped.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --accept 200..=299,429
            --exclude "linkedin\.com"
            index.html humans.txt sitemap.xml robots.txt
          fail: true

  updates:
    name: Check for updates
    # Only on the weekly run and manual runs, so a new upstream major release
    # does not fail ordinary pushes and pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gh and npm are preinstalled on the GitHub-hosted Ubuntu runners.
      - run: .github/scripts/check-updates.sh
        env:
          GH_TOKEN: ${{ github.token }}

  lighthouse:
    name: Audit performance, accessibility and SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
