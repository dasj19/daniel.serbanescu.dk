name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch external links that break without any commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes html-validate@11 index.html

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with HTTP 999, so it is skipped.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --accept 200..=299,429
            --exclude "linkedin\.com"
            index.html humans.txt sitemap.xml robots.txt
          fail: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
