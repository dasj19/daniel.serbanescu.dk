<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
    <!-- Maskable icon: favicon.svg at 70% on a full-bleed background, so the
         glyph stays inside the 80% safe zone whatever mask the platform applies. -->
    <rect width="512" height="512" fill="#aaaaff"/>
    <image x="76.8" y="76.8" width="358.4" height="358.4" href="favicon.svg" xlink:href="favicon.svg"/>
</svg>
